apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: tu-usuario-docker/sanosysalvos-frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: BFF_INTERNAL_URL
          value: "http://bff-service:8084"